<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex 双语翻译</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <div class="logo">文</div>
        <div>
          <h1>Codex 双语翻译</h1>
          <p>原文下方逐段显示译文</p>
        </div>
      </header>

      <label class="field" for="target-language">
        <span>翻译为</span>
        <select id="target-language">
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
        </select>
      </label>

      <div class="actions">
        <button id="translate-button" class="primary" type="button">翻译当前网页</button>
        <button id="restore-button" class="secondary" type="button">恢复原网页</button>
      </div>

      <section class="status" aria-live="polite">
        <div class="progress-track" aria-hidden="true">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <p id="status-text">准备就绪</p>
      </section>

      <p class="privacy">
        翻译时，识别到的网页正文会发送给当前 Codex 使用的模型服务；不会读取输入框、Cookie 或浏览历史。
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
